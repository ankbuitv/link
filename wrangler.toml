# ============================================================================
# link-center — Cloudflare Workers configuration
#
# Custom domain (zone must be attached to your Cloudflare account):
#   routes = [{ pattern = "link.ankb.qzz.io", custom_domain = true }]
#
# First deploy — two ways:
#
#   Option A — automatic provisioning (default, zero config):
#       The D1 database "link-center-db" and the KV namespace "KV" are
#       created automatically the first time you run `wrangler deploy`
#       (IDs are left blank below on purpose).
#
#   Option B — create resources yourself and paste their IDs:
#       Dashboard → Workers & Pages → D1 → Create database  (copy database_id)
#       Dashboard → Workers & Pages → KV → Create namespace (copy id)
#       then add `database_id = "..."` / `preview_database_id = "..."`
#       under [[d1_databases]] and `id = "..."` under [[kv_namespaces]].
#
# After the first deploy, run the schema migrations:
#       npx wrangler d1 migrations apply link-center-db --remote
# (if you used Option A, find the generated database_id in the dashboard:
#  D1 → link-center-db → Settings)
#
# Secrets (never commit them):
#       npx wrangler secret put BREVO_API_KEY
#       npx wrangler secret put BREVO_SENDER_EMAIL
#       npx wrangler secret put BREVO_SENDER_NAME
#       npx wrangler secret put BREVO_WEBHOOK_SECRET
#       npx wrangler secret put CLICK_SALT
#       npx wrangler secret put SETUP_TOKEN   (optional first-run hardening)
# ============================================================================

name = "link-center"
main = "src/index.ts"
compatibility_date = "2026-08-13"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# --- Custom domain ----------------------------------------------------------
# Handles https://link.ankb.qzz.io/* on the Worker.
[[routes]]
pattern = "link.ankb.qzz.io"
custom_domain = true

# --- Plain-text variables (non-secret; fine to commit) ----------------------
[vars]
APP_NAME = "Link Center"
APP_URL = "https://link.ankb.qzz.io"
DEFAULT_REDIRECT_STATUS = "302"
SESSION_DAYS = "30"
LOGIN_RATE_LIMIT = "10"
LOGIN_RATE_WINDOW_SECONDS = "300"
API_RATE_LIMIT = "300"
API_RATE_WINDOW_SECONDS = "60"
ANALYTICS_RETENTION_DAYS = "365"
# Override for testing / self-hosting Brevo-compatible endpoints.
# BREVO_API_BASE_URL = "https://api.brevo.com/v3"

# --- Module rules: bundle dashboard assets as raw text ----------------------
[[rules]]
type = "Text"
globs = ["**/public/assets/app.js", "**/public/assets/styles.css"]
fallthrough = false

# --- D1 database ------------------------------------------------------------
# IDs are intentionally blank → auto-created on first `wrangler deploy`.
# (Optional) to pin resources, add:
#   database_id = "..."          # D1 → link-center-db → Settings
#   preview_database_id = "..."
[[d1_databases]]
binding = "DB"
database_name = "link-center-db"
migrations_dir = "migrations"

# --- KV namespace -----------------------------------------------------------
# ID intentionally blank → auto-created on first `wrangler deploy`.
# (Optional) to pin:  id = "..."  (KV → your namespace → Settings)
[[kv_namespaces]]
binding = "KV"

# --- Secrets (set with `wrangler secret put <NAME>`, never in this file) ----
# BREVO_API_KEY          Brevo API key (xkeysib-...). Server-side only.
# BREVO_SENDER_EMAIL     Default sender email address.
# BREVO_SENDER_NAME      Default sender display name.
# BREVO_WEBHOOK_SECRET   Shared token for Brevo webhook verification.
# CLICK_SALT             Random secret used to anonymise click analytics.
